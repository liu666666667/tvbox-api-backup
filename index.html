<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes">
  <title>海量接口搬运备份</title>
  <link rel="icon" type="image/jpeg" href="vip/jueson.jpg">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #eef2f7;
      color: #1a2b3d;
      padding: 20px 14px 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus, button:focus-visible,
    input:focus, input:focus-visible,
    .nav-tab:focus, .copy-btn:focus { outline: none !important; }

    .container {
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      width: 100%;
      overflow-x: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #modeToggleBtn {
      position: absolute;
      top: 14px;
      left: 10px;
      z-index: 999;
      width: 56px;
      padding: 6px 4px;
      border-radius: 50px;
      border: 1px solid #4a9eff;
      background: #fff;
      color: #4a9eff;
      font-size: .58rem;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
    }

    .header-block { text-align: center; margin-bottom: 16px; padding-top: 14px; }
    h1 { font-size: 1.35rem; font-weight: 700; color: #0a1a2b; }
    h1 .header-logo {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      border: 1px solid #4a9eff;
      object-fit: cover;
      vertical-align: -.5rem;
      margin-right: 8px;
    }
    .header-divider { height: 1px; background: #e4ebf3; margin: 12px 0; }
    .subtitle { font-size: .78rem; color: #7a8fa3; line-height: 1.6; }

    .search-box {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid #d4dbe5;
      border-radius: 50px;
      font-size: .92rem;
      background: #fff;
      outline: none;
      -webkit-appearance: none;
    }
    body.simple-mode .search-box { margin-bottom: 20px; }
    body:not(.simple-mode) .search-box { margin-bottom: 14px; }

    .main-card {
      background: #fff;
      border-radius: 8px;
      padding: 20px 22px 18px;
      border: 1px solid #d4dbe5;
      width: 100%;
      overflow-x: hidden;
      flex: 1;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      justify-content: center;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab {
      padding: 5px 12px;
      border: 1.5px solid #4a9eff;
      border-radius: 30px;
      background: #fff;
      color: #4a9eff;
      font-size: .72rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.2;
    }
    .nav-tab.active { background: #4a9eff; color: #fff; }
    .nav-tab:active { transform: scale(.95); }

    .tab-panel { display: none; width: 100%; }
    .tab-panel.active { display: block; }

    .api-list { display: flex; flex-direction: column; width: 100%; }
    .api-item { padding: 14px 0; border-bottom: 1px solid #e4ebf3; }
    .api-item:last-child { border-bottom: none; }
    .api-item.hidden { display: none !important; }
    .api-item-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .api-item-name {
      font-size: 1rem;
      font-weight: 700;
      color: #0a1a2b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .api-item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .72rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-new { color: #16a34a; font-weight: 600; }
    .badge-old { color: #ca8a04; font-weight: 600; }
    .api-item-urls { display: flex; flex-direction: column; gap: 6px; }
    .url-line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #f4f8fc;
      border: 1px solid #e0e8f0;
      border-radius: 50px;
      min-width: 0;
    }
    .url-tag {
      font-size: .68rem;
      font-weight: 600;
      color: #3a5a7a;
      background: #d8e8f8;
      padding: 2px 14px;
      border-radius: 50px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .url-text {
      font-size: .78rem;
      color: #2563eb;
      word-break: break-all;
      overflow-wrap: break-word;
      line-height: 1.4;
      flex: 1;
      min-width: 0;
    }
